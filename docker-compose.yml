name: flowpilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowpilot
      POSTGRES_PASSWORD: flowpilot
      POSTGRES_DB: flowpilot
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/000-create-n8n-db.sql:/docker-entrypoint-initdb.d/000-create-n8n-db.sql:ro
      - ./infra/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpilot -d flowpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: api
    environment:
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      WORKFLOW_DRIVER: n8n
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/flowpilot-lead-intake
      N8N_INTERNAL_BASE_URL: http://n8n:5678
      N8N_EVENT_SECRET: ${N8N_EVENT_SECRET:-flowpilot-local-secret}
      PERSISTENCE_DRIVER: postgres
      DATABASE_URL: postgresql://flowpilot:flowpilot@postgres:5432/flowpilot
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    build:
      context: ./n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: flowpilot
      DB_POSTGRESDB_PASSWORD: flowpilot
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
      N8N_ENCRYPTION_KEY: flowpilot-local-encryption-key-change-me
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: "60"
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "268435456"
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "1000"
      FLOWPILOT_API_URL: http://api:3001
      N8N_EVENT_SECRET: ${N8N_EVENT_SECRET:-flowpilot-local-secret}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:3001/api
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  n8n_data:
